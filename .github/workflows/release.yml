name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_windows_amd64:
    name: Build Windows amd64
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    outputs:
      version: ${{ steps.release_metadata.outputs.version }}
      prerelease: ${{ steps.release_metadata.outputs.prerelease }}
      artifact_name: ${{ steps.release_metadata.outputs.artifact_name }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Validate release tag
        id: release_metadata
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $identifier = '(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          $pattern = "^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-$identifier(\.$identifier)*)?$"
          if ($tag -notmatch $pattern) {
            Write-Error "Release tag is not supported SemVer: $tag"
            exit 1
          }
          $version = $tag.Substring(1)
          $prerelease = $version.Contains('-').ToString().ToLowerInvariant()
          $artifactName = "donethen-$version-windows-amd64"
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_PRERELEASE=$prerelease" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact_name=$artifactName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check formatting
        shell: pwsh
        run: |
          $files = @(git ls-files '*.go')
          $unformatted = @(gofmt -l $files)
          if ($unformatted.Count -ne 0) {
            Write-Error "The following files are not formatted:`n$($unformatted -join "`n")"
            exit 1
          }

      - name: Test
        run: go test -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Build and package
        shell: pwsh
        run: |
          $packageName = "donethen_$($env:RELEASE_VERSION)_windows_amd64"
          $packageDir = Join-Path $env:RUNNER_TEMP $packageName
          $distDir = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          New-Item -ItemType Directory -Path $distDir -Force | Out-Null

          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $ldflags = "-X github.com/andyandymike/done-then/internal/cli.Version=$($env:RELEASE_VERSION)"
          $binary = Join-Path $packageDir 'donethen.exe'
          go build -trimpath -ldflags $ldflags -o $binary ./cmd/donethen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $actualVersion = (& $binary --version | Out-String).Trim()
          $expectedVersion = "donethen $($env:RELEASE_VERSION)"
          if ($actualVersion -cne $expectedVersion) {
            Write-Error "Version mismatch: expected '$expectedVersion', got '$actualVersion'"
            exit 1
          }

          $buildInfo = @(& go version -m $binary)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expectedRevision = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($buildInfo -cnotcontains "`tbuild`tvcs.revision=$expectedRevision") {
            Write-Error "Release binary does not contain the tagged revision $expectedRevision."
            exit 1
          }
          if ($buildInfo -cnotcontains "`tbuild`tvcs.modified=false") {
            Write-Error 'Release binary is missing clean VCS metadata.'
            exit 1
          }

          Copy-Item README.md, LICENSE, CHANGELOG.md -Destination $packageDir
          Copy-Item internal/capability/manifest.json -Destination (Join-Path $packageDir 'CAPABILITIES.json')
          $buildInfo | Out-File -FilePath (Join-Path $packageDir 'BUILDINFO.txt') -Encoding utf8
          $archive = Join-Path $distDir "$packageName.zip"
          Compress-Archive -Path (Join-Path $packageDir '*') -DestinationPath $archive

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName } | Sort-Object)
          } finally {
            $zip.Dispose()
          }
          $expectedEntries = @('BUILDINFO.txt', 'CAPABILITIES.json', 'CHANGELOG.md', 'LICENSE', 'README.md', 'donethen.exe')
          if (Compare-Object $expectedEntries $entries) {
            Write-Error "Unexpected archive entries: $($entries -join ', ')"
            exit 1
          }

          $created = (git show -s --format=%cI HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sbom = "$archive.spdx.json"
          $sbomArguments = @(
            'run', './cmd/donethen-sbom',
            '--artifact', $archive, '--binary', $binary, '--output', $sbom,
            '--version', $env:RELEASE_VERSION,
            '--goos', 'windows', '--goarch', 'amd64', '--created', $created
          )
          & go @sbomArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $([System.IO.Path]::GetFileName($archive))" |
            Out-File -FilePath (Join-Path $distDir 'SHA256SUMS.txt') -Encoding ascii

      - name: Attest release assets
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: |
            dist/*.zip
            dist/*.spdx.json
            dist/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.release_metadata.outputs.artifact_name }}
          path: |
            dist/*.zip
            dist/*.spdx.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  build_portable:
    name: Build ${{ matrix.goos }} ${{ matrix.goarch }}
    needs: build_windows_amd64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.build_windows_amd64.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: arm64
            archive: zip
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build and package portable artifact
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          package_name="donethen_${RELEASE_VERSION}_${GOOS}_${GOARCH}"
          package_dir="$RUNNER_TEMP/$package_name"
          dist_dir="$GITHUB_WORKSPACE/dist"
          mkdir -p "$package_dir" "$dist_dir"

          binary_name="donethen"
          if [[ "$GOOS" == "windows" ]]; then
            binary_name="donethen.exe"
          fi
          ldflags="-X github.com/andyandymike/done-then/internal/cli.Version=$RELEASE_VERSION"
          go build -trimpath -ldflags "$ldflags" -o "$package_dir/$binary_name" ./cmd/donethen

          if [[ "$GOOS" == "linux" ]]; then
            go build -trimpath -o "$package_dir/donethen-powerd" ./cmd/donethen-powerd
            cp scripts/install-linux.sh "$package_dir/install-linux.sh"
            cp packaging/linux/donethen-powerd.service "$package_dir/donethen-powerd.service"
            cp packaging/linux/donethen.conf "$package_dir/donethen.conf"
            chmod 0755 "$package_dir/donethen" "$package_dir/donethen-powerd" "$package_dir/install-linux.sh"
          fi

          cp README.md LICENSE CHANGELOG.md "$package_dir/"
          cp internal/capability/manifest.json "$package_dir/CAPABILITIES.json"
          go version -m "$package_dir/$binary_name" > "$package_dir/BUILDINFO.txt"
          expected_revision="$(git rev-parse HEAD)"
          grep -F "vcs.revision=$expected_revision" "$package_dir/BUILDINFO.txt" >/dev/null
          grep -F 'vcs.modified=false' "$package_dir/BUILDINFO.txt" >/dev/null

          if [[ "$GOOS" == "linux" ]]; then
            expected=$'BUILDINFO.txt\nCAPABILITIES.json\nCHANGELOG.md\nLICENSE\nREADME.md\ndonethen\ndonethen-powerd\ndonethen-powerd.service\ndonethen.conf\ninstall-linux.sh'
          elif [[ "$GOOS" == "windows" ]]; then
            expected=$'BUILDINFO.txt\nCAPABILITIES.json\nCHANGELOG.md\nLICENSE\nREADME.md\ndonethen.exe'
          else
            expected=$'BUILDINFO.txt\nCAPABILITIES.json\nCHANGELOG.md\nLICENSE\nREADME.md\ndonethen'
          fi
          actual="$(find "$package_dir" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)"
          if [[ "$actual" != "$(printf '%s\n' "$expected" | sort)" ]]; then
            printf 'Unexpected package contents:\n%s\n' "$actual" >&2
            exit 1
          fi

          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            archive_name="$package_name.zip"
            (cd "$RUNNER_TEMP" && zip -q -r "$dist_dir/$archive_name" "$package_name")
          else
            archive_name="$package_name.tar.gz"
            tar -C "$RUNNER_TEMP" -czf "$dist_dir/$archive_name" "$package_name"
          fi
          created="$(git show -s --format=%cI HEAD)"
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go run ./cmd/donethen-sbom --artifact "$dist_dir/$archive_name" --binary "$package_dir/$binary_name" --output "$dist_dir/$archive_name.spdx.json" --version "$RELEASE_VERSION" --goos "$GOOS" --goarch "$GOARCH" --created "$created"
          (cd "$dist_dir" && sha256sum "$archive_name" > "$package_name.sha256")

      - name: Attest portable release assets
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: |
            dist/*.${{ matrix.archive }}
            dist/*.spdx.json
            dist/*.sha256

      - name: Upload portable workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: donethen-${{ env.RELEASE_VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.${{ matrix.archive }}
            dist/*.spdx.json
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    needs:
      - build_windows_amd64
      - build_portable
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.build_windows_amd64.outputs.version }}
      RELEASE_PRERELEASE: ${{ needs.build_windows_amd64.outputs.prerelease }}

    steps:
      - name: Download verified workflow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: donethen-${{ needs.build_windows_amd64.outputs.version }}-*
          merge-multiple: true
          path: dist

      - name: Verify downloaded release assets
        shell: pwsh
        run: |
          $expectedArchives = @(
            "donethen_$($env:RELEASE_VERSION)_windows_amd64.zip",
            "donethen_$($env:RELEASE_VERSION)_windows_arm64.zip",
            "donethen_$($env:RELEASE_VERSION)_linux_amd64.tar.gz",
            "donethen_$($env:RELEASE_VERSION)_linux_arm64.tar.gz",
            "donethen_$($env:RELEASE_VERSION)_darwin_amd64.tar.gz",
            "donethen_$($env:RELEASE_VERSION)_darwin_arm64.tar.gz"
          ) | Sort-Object
          $actualArchives = @(Get-ChildItem -LiteralPath dist -File | Where-Object {
            $_.Name.EndsWith('.zip') -or $_.Name.EndsWith('.tar.gz')
          } | Select-Object -ExpandProperty Name | Sort-Object)
          if (Compare-Object $expectedArchives $actualArchives) {
            Write-Error "Release archive set is incomplete or unexpected: $($actualArchives -join ', ')"
            exit 1
          }

          $expectedSBOMs = @($expectedArchives | ForEach-Object { "$_.spdx.json" } | Sort-Object)
          $actualSBOMs = @(Get-ChildItem -LiteralPath dist -File -Filter '*.spdx.json' |
            Select-Object -ExpandProperty Name | Sort-Object)
          if (Compare-Object $expectedSBOMs $actualSBOMs) {
            Write-Error "Release SBOM set is incomplete or unexpected: $($actualSBOMs -join ', ')"
            exit 1
          }
          foreach ($archiveName in $expectedArchives) {
            $sbomPath = Join-Path 'dist' "$archiveName.spdx.json"
            try {
              $sbom = Get-Content -LiteralPath $sbomPath -Raw | ConvertFrom-Json -ErrorAction Stop
            } catch {
              Write-Error "Invalid SPDX JSON for $archiveName."
              exit 1
            }
            if ($sbom.spdxVersion -cne 'SPDX-2.3' -or
                $sbom.dataLicense -cne 'CC0-1.0' -or
                $sbom.SPDXID -cne 'SPDXRef-DOCUMENT') {
              Write-Error "Unexpected SPDX document header for $archiveName."
              exit 1
            }
            $mainPackages = @($sbom.packages | Where-Object {
              $_.SPDXID -ceq 'SPDXRef-Package-DoneThen' -and
              $_.licenseDeclared -ceq 'Apache-2.0'
            })
            if ($mainPackages.Count -ne 1) {
              Write-Error "SBOM primary package is missing or ambiguous for $archiveName."
              exit 1
            }
            $files = @($sbom.files | Where-Object { $_.fileName -ceq "./$archiveName" })
            if ($files.Count -ne 1) {
              Write-Error "SBOM does not describe exactly one matching archive: $archiveName."
              exit 1
            }
            $sha256Entries = @($files[0].checksums | Where-Object { $_.algorithm -ceq 'SHA256' })
            $actualHash = (Get-FileHash -Algorithm SHA256 (Join-Path 'dist' $archiveName)).Hash.ToLowerInvariant()
            if ($sha256Entries.Count -ne 1 -or $sha256Entries[0].checksumValue -cne $actualHash) {
              Write-Error "SBOM checksum mismatch for $archiveName."
              exit 1
            }
          }

          $checksumFiles = @(Get-ChildItem -LiteralPath dist -File | Where-Object {
            $_.Name -eq 'SHA256SUMS.txt' -or $_.Name.EndsWith('.sha256')
          })
          $verifiedLines = [System.Collections.Generic.List[string]]::new()
          foreach ($checksumFile in $checksumFiles) {
            foreach ($line in @(Get-Content -LiteralPath $checksumFile.FullName)) {
              $line = $line.Trim()
              if ($line -notmatch '^([0-9a-f]{64})  ([A-Za-z0-9_.-]+)$') {
                Write-Error "Invalid checksum line in $($checksumFile.Name)."
                exit 1
              }
              $archiveName = $Matches[2]
              if ($expectedArchives -cnotcontains $archiveName) {
                Write-Error "Checksum references an unexpected archive: $archiveName"
                exit 1
              }
              $actualHash = (Get-FileHash -Algorithm SHA256 (Join-Path 'dist' $archiveName)).Hash.ToLowerInvariant()
              if ($actualHash -cne $Matches[1]) {
                Write-Error "Release archive checksum mismatch for $archiveName."
                exit 1
              }
              $verifiedLines.Add("$actualHash  $archiveName")
            }
          }
          $combined = @($verifiedLines | Sort-Object -Unique)
          if ($combined.Count -ne $expectedArchives.Count) {
            Write-Error 'Not every release archive has exactly one verified checksum.'
            exit 1
          }
          $combined | Out-File -FilePath 'dist/SHA256SUMS.txt' -Encoding ascii

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath dist -File | Where-Object {
            $_.Name.EndsWith('.zip') -or $_.Name.EndsWith('.tar.gz') -or
            $_.Name.EndsWith('.spdx.json')
          } | Sort-Object Name | Select-Object -ExpandProperty FullName)
          $arguments = @('release', 'create', $env:RELEASE_TAG)
          $arguments += $assets
          $arguments += @(
            (Resolve-Path 'dist/SHA256SUMS.txt').Path,
            '--verify-tag', '--generate-notes',
            '--title', "DoneThen $($env:RELEASE_VERSION)"
          )
          if ($env:RELEASE_PRERELEASE -eq 'true') {
            $arguments += '--prerelease'
            $arguments += '--latest=false'
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
